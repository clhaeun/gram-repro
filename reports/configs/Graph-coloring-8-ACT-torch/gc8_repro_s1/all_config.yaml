arch:
  H_cycles: 3
  H_layers: 0
  L_cycles: 4
  L_layers: 2
  expansion: 4
  forward_dtype: bfloat16
  halt_exploration_prob: 0.1
  halt_max_steps: 16
  hidden_size: 512
  kl_balance: 0.8
  kl_coef: 0.5
  loss:
    loss_type: stablemax_cross_entropy
    name: losses@ACTLossHead
  lprm_coef: 1.0
  mlp_t: false
  name: recursive_reasoning.gram@TinyRecursiveReasoningModel_ACTV1
  no_ACT_continue: true
  noise_head_expansion: 1.5
  num_heads: 8
  pos_encodings: rope
  puzzle_emb_len: 16
  puzzle_emb_ndim: 512
beta1: 0.9
beta2: 0.95
checkpoint_every_eval: true
checkpoint_path: checkpoints/Graph-coloring-8-ACT-torch/gc8_repro_s1
data_paths:
- data/graph-coloring-8
data_paths_test: []
ema: true
ema_rate: 0.9999
epochs: 5000
eval_interval: 250
evaluators:
- name: graph_coloring@GraphColoring
global_batch_size: 768
load_checkpoint: null
lr: 0.0001
lr_min_ratio: 1.0
lr_warmup_steps: 500
min_eval_interval: 0
nodecay_marked: false
project_name: Graph-coloring-8-ACT-torch
puzzle_emb_lr: 0.0001
puzzle_emb_weight_decay: 1.0
run_name: gc8_repro_s1
seed: 1
weight_decay: 1.0
