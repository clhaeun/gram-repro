lr_min_ratio: 1.0
lr_warmup_steps: 500
min_eval_interval: 0
nodecay_logvar_bias: false
nodecay_marked: false
nodecay_y_proj: false
project_name: Nqueens-8-ACT-torch
puzzle_emb_lr: 0.001
puzzle_emb_weight_decay: 0.001
run_name: fp_a1_nq8_s0
seed: 0
weight_decay: 0.001
