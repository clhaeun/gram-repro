  no_ACT_continue: true
  noise_head_expansion: 1.5
  num_heads: 8
  pos_encodings: rope
  puzzle_emb_len: 16
  puzzle_emb_ndim: 512
  y_inject: add
  y_onehot: true
  y_onehot_proj: zeropad
  y_onehot_scale: 0.573
beta1: 0.9
beta2: 0.95
checkpoint_every_eval: true
checkpoint_path: checkpoints/Nqueens-8-ACT-torch/fp_a1_nq8_s0
data_paths:
- data/nqueens-8
data_paths_test: []
dual_eval: true
ema: true
