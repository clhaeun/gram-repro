arch:
  H_cycles: 3
  H_layers: 0
  L_cycles: 4
  L_layers: 2
  expansion: 4
  forward_dtype: bfloat16
  halt_exploration_prob: 0.1
  halt_max_steps: 16
  hidden_size: 512
  kl_balance: 0.8
  kl_coef: 0.07
  kl_reduction: sum
  logvar_bias_init: 0.0
  loss:
    loss_type: stablemax_cross_entropy
    name: losses@ACTLossHead
  lprm_coef: 1.0
