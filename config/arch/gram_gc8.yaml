name: recursive_reasoning.gram@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16

# GRAM's (T, K): T = H_cycles outer transitions, K = L_cycles inner refinements
H_cycles: 3
L_cycles: 4

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

# N-Queens 와 동일하게 attention core 를 쓴다. sudoku 전용 mlp_t 예외는 끄고
# 위치는 rope 로 인코딩한다.
mlp_t: False
pos_encodings: rope
forward_dtype: bfloat16

puzzle_emb_len: 16
no_ACT_continue: True

# GRAM용
# seq_len / vocab_size 는 여기 없다 -- pretrain.py:create_model() 이 데이터 metadata 에서
# 주입한다. GC-8 은 seq_len=28 (=8*7/2), vocab_size=6 (0=PAD/ignore, 1=no edge, 2=edge,
# 3/4/5=색). yaml 에 적으면 안 된다.
#
# L = seq_len + puzzle_emb_len = 28 + 16 = 44.  8x8(80) / 10x10(116) 과 다르므로
# sum <-> mean 환산 배율이 44 다 (sum 0.5 == mean 22). 아래는 sum 눈금이라 논문값 그대로다.
kl_coef: 0.5        # 논문 B.2, Graph Coloring 8-vertex (sum 눈금 = 논문값 그대로)
kl_balance: 0.8
lprm_coef: 1.0
# 최종 설정은 코드에 하드코딩됐다 (2026-08-03 minimal):
#   kl_reduction=sum (losses.py) / y one-hot zeropad x 0.573 / logvar bias init 0.0 /
#   y_inject: u_y = z_H + y_emb (gram.py)

noise_head_expansion: 1.5

# ---- struct 선언 (기본값 = 현행과 비트 단위 동일) ------------------------------
# ★ pydantic 선언만으로는 부족하다 -- hydra arch config 는 struct 라 여기 없으면
#   arch.<필드> 오버라이드가 'Key not in struct' 로 즉사한다.
#   (reports/VERIFY_CHECKLIST.md (a) 참조)

# ε 주입 계수. 1.0 = z_H = z_H + eps (현행).
# inner z_L loop damped update. 1.0 = 감쇠 없음 (현행).
# 진단 B+ (측정 전용): transition 별 KL/μ/σ 기록. False = 현행과 비트 단위 동일.
# 0.0 = 현행과 비트 단위 동일.
# SS 분기 전용 RNG 시드. ★ rank 무관해야 한다 (gram.py 의 _ss_gen 주석).
