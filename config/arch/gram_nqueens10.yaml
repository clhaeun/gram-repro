# N-Queens 10x10.  gram_nqueens8.yaml 의 사본이며 값은 전부 동일하다 -- seq_len 은
# arch config 가 아니라 dataset metadata 에서 온다(pretrain.py:124), 그래서
# data_paths=[data/nqueens-10] 만 바꾸면 seq_len=100 이 자동으로 들어간다.
# L = seq_len + puzzle_emb_len = 100 + 16 = 116.  (8x8 은 64 + 16 = 80)
# kl_reduction 은 sum 고정(losses.py)이라 β 눈금이 L 에 비례한다 -- β 는 task 별 값이다.
name: recursive_reasoning.gram@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16

# GRAM's (T, K): T = H_cycles outer transitions, K = L_cycles inner refinements
H_cycles: 3
L_cycles: 4

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

# N-Queens uses the attention core: the sudoku-only mlp_t exception is off here,
# and positions are encoded with rope rather than being dropped.
mlp_t: False
pos_encodings: rope
forward_dtype: bfloat16

puzzle_emb_len: 16
no_ACT_continue: True

# 최종 설정은 코드에 하드코딩됐다 (2026-08-03 minimal):
#   kl_reduction=sum (losses.py) / y one-hot zeropad x 0.573 / logvar bias init 0.0 /
#   y_inject: u_y = z_H + y_emb (gram.py)
kl_coef: 0.045      # KL 가중치 (beta), nq10 final 라운드 값 (sum 눈금; 구 yaml 0.07 은 mean 눈금 sweep 잔재)
kl_balance: 0.8
lprm_coef: 1.0

noise_head_expansion: 1.5

# 진단 B+ (측정 전용): transition 별 KL/μ/σ 기록. False = 현행과 비트 단위 동일.
# ★ pydantic 선언만으로는 부족하다 -- hydra arch config 는 struct 라 여기 없으면
#   arch.diag_kl_per_transition 오버라이드가 'Key not in struct' 로 즉사한다.
diag_kl_per_transition: False

# scheduled sampling: 학습 중 각 transition 에서 확률 ss_prob 로 prior 를 쓴다.
# 0.0 = 현행과 비트 단위 동일.  ★ struct 선언 필수 (위와 같은 이유).
ss_prob: 0.0