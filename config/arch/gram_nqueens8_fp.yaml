# gram_nqueens8.yaml 의 사본 + FPRM 기여1(pre-norm + residual scaling) 활성.
# 기존 gram_nqueens8.yaml 은 손대지 않는다 -- 기존 run 재현 축 보존.
name: recursive_reasoning.gram@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16

# GRAM's (T, K): T = H_cycles outer transitions, K = L_cycles inner refinements
H_cycles: 3
L_cycles: 4

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

# N-Queens uses the attention core: the sudoku-only mlp_t exception is off here,
# and positions are encoded with rope rather than being dropped.
mlp_t: False
pos_encodings: rope
forward_dtype: bfloat16

puzzle_emb_len: 16
no_ACT_continue: True

# GRAM용 -- 정준 설정은 2026-08-03 minimal 에서 코드에 하드코딩됐다:
#   kl_reduction=sum (losses.py) / y one-hot zeropad x 0.573 / logvar bias init 0.0 /
#   y_inject: u_y = z_H + y_emb (gram.py)
# (구 주석의 "logvar_bias_init -4.0 정준" 은 final 라운드 확정값 0.0 이전 기록 -- 정정)
kl_coef: 0.07
kl_balance: 0.8
lprm_coef: 1.0

#   'Key not in struct' 로 즉사한다 -- pydantic 선언만으로는 부족하다.

# inner z_L loop damped update (z_L <- eta*z_tilde + (1-eta)*z_L). 1.0 = 비트 동일.

noise_head_expansion: 1.5

# ---- FPRM 기여1 (use_fp_transformer 외 나머지는 dataclass default 가 이미 활성값이지만
#      사후 추적을 위해 전부 명시한다) --------------------------------------------
use_fp_transformer: true
norm_type: pre-norm
residual_scale: fixed
alpha_1_init: 0.75
alpha_2_init: 0.25
outer_only: false
conv_type: none
norm_placement: none            # FPRM Appendix Table 6 확인값 (FPRM/Looped Transformer 모두 none)
normalize_input_injection: false  # 코드 전용 knob, 논문 미언급 -- false 유지
conv_kernel_size: 3
conv_bias: false
softmax_temp: 1.0
use_spec_norm_linear: false
weight_dropout: 0.0
# causal 은 여기 쓰지 마라: pretrain.py create_model 이 causal=False 를 직접 주입해서
# yaml 에도 있으면 dict() 중복 키워드로 즉사한다 (seq_len/vocab_size 와 같은 부류).
#
# lr/wd 근거 (run config 쪽 값이지만 여기 기록):
#   FPRM Table 4 Sudoku      lr 1e-3 / wd 1e-3  α 0.75,0.25  AdamW
#        Table 5 Maze        lr 1e-4 / wd 1.0   α 0.75,0.25  Adam-Atan2
#        Table 6 state-track lr 1e-3 / wd 1e-2  α 0.5,0.5    Adam-Atan2
#        Table 7 ARC         lr 1e-3 / wd 1e-2  α 0.75,0.25  Adam-Atan2
# wd 를 내리는 것은 pre-norm 의 요구사항이 아니다 -- Maze 가 TRM 과 동일한
# lr 1e-4 / wd 1.0 에서 pre-norm + residual scaling 을 쓴다. task 별 튜닝일 뿐.
# A2 arm 이 Table 4 값(1e-3/1e-3)을 쓰는 근거는 "우리 task 가 Sudoku 이므로
# Table 4 를 따름" 이고, A3' arm(1e-4/1.0)은 Maze 선례 + 기존 확립 사실(전부
# wd=1.0 전제)과의 비교 축 유지다.  α init 도 task 의존(state-tracking 만
# 0.5/0.5) -- 우리는 0.75/0.25 유지.
