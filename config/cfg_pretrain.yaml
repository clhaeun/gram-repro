# ARC training config

defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path
data_paths: ['data/arc-aug-1000']
data_paths_test: []

evaluators:
  - name: arc@ARC

# Hyperparams - Training
global_batch_size: 768

epochs: 100000
eval_interval: 10000
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 1e-2

seed: 0
min_eval_interval: 0 # when to start the eval

ema: False # use Exponential-Moving-Average. True 면 raw(non-EMA) 평가도 항상 병행된다
ema_rate: 0.999 # EMA-rate

# FPRM 이 `_no_weight_decay` 로 마킹한 파라미터(fp_transformer 의 α 등)를 wd=0 group 으로.
# ★ pydantic 필드 추가 = yaml 필드 추가 (CHECKLIST.md 1항): hydra 가 struct 모드라
#   여기 없으면 override 자체가 거부된다.
nodecay_marked: False

# 노이즈 head 의 weight_decay 예외 (nodecay_marked 와 독립). 기본 False = 비트 동일.
#   nodecay_logvar_bias -> prior_logvar_bias / post_logvar_bias
nodecay_logvar_bias: False
