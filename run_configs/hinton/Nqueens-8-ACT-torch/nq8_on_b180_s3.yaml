arch:
  H_cycles: 3
  H_layers: 0
  L_cycles: 4
  L_layers: 2
  expansion: 4
  forward_dtype: bfloat16
  halt_exploration_prob: 0.1
  halt_max_steps: 16
  hidden_size: 512
  kl_balance: 0.8
  kl_coef: 1.8
  kl_reduction: mean
  loss:
    loss_type: stablemax_cross_entropy
    name: losses@ACTLossHead
  lprm_coef: 1.0
  mlp_t: false
  name: recursive_reasoning.gram@TinyRecursiveReasoningModel_ACTV1
  no_ACT_continue: true
  noise_head_expansion: 1.5
  num_heads: 8
  pos_encodings: rope
  puzzle_emb_len: 16
  puzzle_emb_ndim: 512
  y_onehot: true
  y_onehot_proj: zeropad
  y_onehot_scale: 0.573
beta1: 0.9
beta2: 0.95
checkpoint_every_eval: true
checkpoint_path: checkpoints/Nqueens-8-ACT-torch/nq8_on_b180_s3
data_paths:
- data/nqueens-8
data_paths_test: []
ema: false
ema_rate: 0.9999
epochs: 3000
eval_interval: 200
eval_save_outputs: []
evaluators:
- name: nqueens@NQueens
freeze_weights: false
global_batch_size: 768
load_checkpoint: null
lr: 0.0001
lr_min_ratio: 1.0
lr_warmup_steps: 500
min_eval_interval: 0
project_name: Nqueens-8-ACT-torch
puzzle_emb_lr: 0.0001
puzzle_emb_weight_decay: 1.0
run_name: nq8_on_b180_s3
seed: 3
weight_decay: 1.0
